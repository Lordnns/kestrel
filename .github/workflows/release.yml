# Builds downloadable packages for testers.
#
# - Push a tag like v0.1.0  -> builds everything and publishes a GitHub Release.
# - Run manually (Actions tab -> Release -> Run workflow) -> builds everything
#   and attaches the packages to the workflow run as artifacts.
#
# The full CI suite (ci.yml) runs first; packages are only built if it passes.
# Every package that can run on the build machine runs `kestrel selftest`
# before it is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  macos:
    name: macOS universal (Apple Silicon + Intel)
    needs: ci
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release -p kestrel-cli --target aarch64-apple-darwin
          cargo build --release -p kestrel-cli --target x86_64-apple-darwin
      - name: Make a universal binary and sign it (ad hoc)
        run: |
          mkdir -p dist
          lipo -create -output dist/kestrel \
            target/aarch64-apple-darwin/release/kestrel \
            target/x86_64-apple-darwin/release/kestrel
          codesign --force --sign - dist/kestrel
          lipo -info dist/kestrel
      - name: Self-test (Apple Silicon)
        run: dist/kestrel selftest
      - name: Self-test (Intel slice under Rosetta)
        continue-on-error: true
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 dist/kestrel selftest
      - name: Package
        run: bash scripts/package.sh dist/kestrel kestrel-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-macos-universal
          path: dist/kestrel-macos-universal.tar.gz

  linux:
    name: Linux ${{ matrix.arch }}
    needs: ci
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  target: x86_64-unknown-linux-gnu,  run: "" }
          - { arch: aarch64, target: aarch64-unknown-linux-gnu, run: "qemu-aarch64 -L /usr/aarch64-linux-gnu" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install ARM64 cross linker and qemu
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release -p kestrel-cli --target ${{ matrix.target }}
      - name: Self-test
        run: ${{ matrix.run }} target/${{ matrix.target }}/release/kestrel selftest
      - name: Package
        run: bash scripts/package.sh target/${{ matrix.target }}/release/kestrel kestrel-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-linux-${{ matrix.arch }}
          path: dist/kestrel-linux-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows ${{ matrix.arch }}
    needs: ci
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-pc-windows-msvc,  selftest: true }
          # Cross-compiled on x64; it cannot run here, so testers verify it.
          - { arch: arm64,  target: aarch64-pc-windows-msvc, selftest: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p kestrel-cli --target ${{ matrix.target }}
      - name: Self-test
        if: matrix.selftest
        run: target/${{ matrix.target }}/release/kestrel.exe selftest
      - name: Package
        run: bash scripts/package.sh target/${{ matrix.target }}/release/kestrel.exe kestrel-windows-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-windows-${{ matrix.arch }}
          path: dist/kestrel-windows-${{ matrix.arch }}.zip

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # A full (non-pre) release so /releases/latest/download/<file> always
          # points at the newest tag; package names carry no version for the same reason.
          make_latest: true
