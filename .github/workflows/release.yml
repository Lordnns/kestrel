# Builds downloadable packages for testers.
#
# - Push a tag like v0.1.0  -> builds everything and publishes a GitHub Release.
# - Run manually (Actions tab -> Release -> Run workflow) -> builds everything
#   and attaches the packages to the workflow run as artifacts.
#
# The full CI suite (ci.yml) runs first; packages are only built if it passes.
# Every package that can run on the build machine runs `kestrel selftest`
# before it is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Baked into the binary so `kestrel info` / `selftest` report the release tag.
  # Empty on manual runs, which then report "<cargo version>-dev".
  KESTREL_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  macos:
    name: macOS universal (Apple Silicon + Intel)
    needs: ci
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release -p kestrel-cli --target aarch64-apple-darwin
          cargo build --release -p kestrel-cli --target x86_64-apple-darwin
      - name: Make a universal binary and sign it (ad hoc)
        run: |
          mkdir -p dist
          lipo -create -output dist/kestrel \
            target/aarch64-apple-darwin/release/kestrel \
            target/x86_64-apple-darwin/release/kestrel
          codesign --force --sign - dist/kestrel
          lipo -info dist/kestrel
      - name: Self-test (Apple Silicon)
        run: dist/kestrel selftest
      - name: Package
        run: bash scripts/package.sh dist/kestrel kestrel-macos-universal
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-macos-universal
          path: dist/kestrel-macos-universal.tar.gz

  # The same universal binary, self-tested natively on an Intel Mac.
  macos-intel:
    name: macOS universal on Intel
    needs: macos
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kestrel-macos-universal
      - run: |
          tar xzf kestrel-macos-universal.tar.gz
          kestrel-macos-universal/kestrel selftest

  # Each package is built and self-tested natively on its own OS and CPU.
  linux:
    name: Linux ${{ matrix.arch }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu }
          - { arch: aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p kestrel-cli --target ${{ matrix.target }}
      - name: Self-test
        run: target/${{ matrix.target }}/release/kestrel selftest
      - name: Package
        run: bash scripts/package.sh target/${{ matrix.target }}/release/kestrel kestrel-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-linux-${{ matrix.arch }}
          path: dist/kestrel-linux-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows ${{ matrix.arch }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: windows-2022,   target: x86_64-pc-windows-msvc }
          - { arch: arm64,  os: windows-11-arm, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p kestrel-cli --target ${{ matrix.target }}
      - name: Self-test
        run: target/${{ matrix.target }}/release/kestrel.exe selftest
      - name: Package
        run: bash scripts/package.sh target/${{ matrix.target }}/release/kestrel.exe kestrel-windows-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-windows-${{ matrix.arch }}
          path: dist/kestrel-windows-${{ matrix.arch }}.zip

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, macos-intel, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # A full (non-pre) release so /releases/latest/download/<file> always
          # points at the newest tag; package names carry no version for the same reason.
          make_latest: true
