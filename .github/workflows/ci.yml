name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64",   os: ubuntu-24.04 }
          - { name: "Linux aarch64",  os: ubuntu-24.04-arm }
          - { name: "macOS aarch64",  os: macos-14 }
          - { name: "Windows x86_64", os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Smoke test the CLI
        shell: bash
        run: |
          cargo run -q --release -p kestrel-cli -- info
          cargo run -q --release -p kestrel-cli -- run guest/bin/algos.elf --stats

  guest-binaries-up-to-date:
    name: Guest programs rebuild cleanly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: ./scripts/build-guest.sh
