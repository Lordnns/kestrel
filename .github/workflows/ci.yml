name: CI

# Runs as the first stage of the Release workflow, or manually from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Phase 2 acceptance: the standard homebrew examples, built from source
  # in the public devkitPro container (scripts/build-examples.sh), then run
  # by every native job.
  examples:
    name: Homebrew examples build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/build-examples.sh
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-examples
          path: target/examples/bin/*.nro
          if-no-files-found: error

  native:
    name: ${{ matrix.name }}
    needs: examples
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One native job per host target in PLAN.md section 3.
        include:
          - { name: "Linux x86_64",   os: ubuntu-24.04 }
          - { name: "Linux aarch64",  os: ubuntu-24.04-arm }
          - { name: "Windows x86_64", os: windows-2022 }
          - { name: "Windows arm64",  os: windows-11-arm }
          - { name: "macOS aarch64",  os: macos-15 }
          - { name: "macOS x86_64",   os: macos-15-intel }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # gilrs (gamepads in the window) builds against libudev on Linux.
      - name: Install libudev
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Self-test the CLI
        shell: bash
        run: |
          cargo run -q --release -p kestrel-cli -- info
          cargo run -q --release -p kestrel-cli -- selftest
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-examples
          path: target/examples/bin
      - name: The homebrew examples show what their sources print
        shell: bash
        run: bash scripts/run-examples.sh target/release/kestrel

  # Fallback for Linux ARM in case the native ARM runner is unavailable.
  linux-aarch64-qemu:
    name: Linux aarch64 (cross + qemu)
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -L /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
      # Without the window: cross-linking gilrs would need an arm64 libudev.
      - run: cargo test --workspace --no-default-features --target aarch64-unknown-linux-gnu
      - run: cargo run -q --release -p kestrel-cli --no-default-features --target aarch64-unknown-linux-gnu -- selftest

  guest-programs:
    name: Guest programs rebuild and still pass
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Expected output matches the independent Python model
        run: python3 scripts/gen-expected.py --check
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm libudev-dev pkg-config
      - name: NEON test vectors match the independent Python model
        run: python3 scripts/gen-neon-vectors.py --check
      - run: bash scripts/build-guest.sh
      - run: cargo run -q --release -p kestrel-cli -- selftest
      - name: Programs built with -O3 for Armv8.2 hit no unsupported instruction
        run: sh scripts/check-optimised.sh

  # Real-hardware oracle: the C test programs run natively on a real ARM CPU
  # must print exactly guest/expected, which kestrel is tested against.
  hardware-oracle:
    name: Real ARM CPU agrees (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux aarch64", os: ubuntu-24.04-arm }
          - { name: "macOS aarch64", os: macos-15 }
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang
      - run: clang --version
      - run: sh scripts/check-host.sh
